name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.config.outputs.version }}
      registry: ${{ steps.config.outputs.registry }}
      hash: ${{ steps.config.outputs.hash }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release configuration and maintained notes
        id: config
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ruby work/bin/render-release --json > "$RUNNER_TEMP/release.json"
          version=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("version")' "$RUNNER_TEMP/release.json")
          registry=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("registry")' "$RUNNER_TEMP/release.json")
          test "$RELEASE_TAG" = "v$version"
          test -s "work/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "hash=$(cd work && FARMY_HASH_ONLY=1 sh ./farmy)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [control, keys, knowledge, gate]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image and push digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./work
          file: ./work/release.Dockerfile
          target: ${{ matrix.role }}
          platforms: ${{ matrix.platform }}
          build-args: |
            FARMY_VERSION=${{ needs.prepare.outputs.version }}
            FARMY_HASH=${{ needs.prepare.outputs.hash }}
          outputs: type=image,name=${{ needs.prepare.outputs.registry }}/farmy-${{ matrix.role }},push-by-digest=true,name-canonical=true,push=true
      - name: Export immutable digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          test "${DIGEST#sha256:}" != "$DIGEST"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.role }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.role }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.role }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
  manifests:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Require all eight native digests before publishing any manifest
        run: |
          set -eu
          for role in control keys knowledge gate; do
            for arch in amd64 arm64; do
              test -s "digests/$role-$arch"
              grep -Eq '^sha256:[0-9a-f]{64}$' "digests/$role-$arch"
            done
          done
      - name: Publish both version and latest manifests
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          for role in control keys knowledge gate; do
            image="$REGISTRY/farmy-$role"
            docker buildx imagetools create \
              --tag "$image:$VERSION" --tag "$image:latest" \
              "$image@$(cat digests/$role-amd64)" "$image@$(cat digests/$role-arm64)"
          done
  release:
    needs: [prepare, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Render standalone installer and checksum exact asset bytes
        run: |
          ruby work/bin/render-release dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attach installer and checksum using maintained contributor credits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file "work/releases/$VERSION.md"
          else
            gh release create "v$VERSION" --verify-tag --title "farmy $VERSION" --notes-file "work/releases/$VERSION.md"
          fi
          gh release upload "v$VERSION" dist/install dist/SHA256SUMS --clobber
