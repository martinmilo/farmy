neovim:
  version: 0.12.6
  releases:
    kind: github
    repo: neovim/neovim
    assets:
      linux-amd64-glibc: nvim-linux-x86_64.tar.gz
      linux-arm64-glibc: nvim-linux-arm64.tar.gz
  artifacts:
    linux-amd64-glibc:
      url: https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz
      sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
      format: tar.gz
      min_libc: '2.34'
    linux-arm64-glibc:
      url: https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-arm64.tar.gz
      sha256: 8f1f64a0bdb97247034038c3823c6cbad5bdf9ecd5751b85494b71c3ee04c815
      format: tar.gz
      min_libc: '2.34'
  install:
    apt: mkdir -p "$DESTDIR/usr/local"; tar -xzf "$ARCHIVE" --strip-components=1 -C
      "$DESTDIR/usr/local"
