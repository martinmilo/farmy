[package]
name = "farmy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "one set of containers per repository, run from a control container"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
rpassword = "7"
ratatui = "0.29"
crossterm = "0.28"
farmy-gate = { path = "../farmy-gate" }
regex = "1.13.1"
rustix = { version = "0.38.44", default-features = false, features = ["fs", "process", "std", "stdio"] }

[build-dependencies]
serde_yaml = "0.9"
