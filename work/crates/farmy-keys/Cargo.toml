[package]
name = "farmy-keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "farmy's keys broker: a token proxy with named routes, loaded over a local socket"

[lints]
workspace = true

[dependencies]
rustix = { version = "0.38.44", default-features = false, features = ["process", "std", "thread"] }
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
serde_json = "1"
