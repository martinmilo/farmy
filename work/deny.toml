# sanity/rust rust-v0.1.0
# cargo-deny: advisories, licenses, duplicate versions and sources.
# Adjust before the first run: the license allowlist and the sources below are a starting
# point, not a policy decision made for you.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; pulled in by ratatui 0.29.0 (a proc macro). No maintained replacement needed for 0.1.0; revisit with the dependency review" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained, via serde_yaml; serde_yaml is to be replaced after 0.1.0, see spec record 2026-10-17-1400-replace-serde-yaml" },
]

[licenses]
version = 2
# The licenses farmy accepts, by SPDX id: trimmed to what the dependency tree uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",            # webpki-roots: Mozilla's root certificate list, via ureq's TLS
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "warn"     # a license that drops out of use is noticed

[licenses.private]
ignore = true                       # workspace crates with publish = false need no license field

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true         # a path dependency inside the workspace has no version

[sources]
# crates.io only: no dependency needs another registry or a Git source.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
